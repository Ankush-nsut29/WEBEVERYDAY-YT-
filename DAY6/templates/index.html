<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1>THE FLASK CALCULATOR</h1>
        <form action="#" method="post" >
            <input type="number" name="x" placeholder="Enter first number">
            <select name="opr">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
            <input type="number" name="y" placeholder="Enter second number">
            <input type="submit" class="a">
        </form>
    </body>
</html>
